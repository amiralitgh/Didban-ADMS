<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">آیکون دیدبان</title>
  <desc id="icon-description">فانوس دریایی با نور جاروب‌شونده و موج‌های متحرک</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#086f83"/>
    </linearGradient>
    <radialGradient id="beam-fill" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#fff7b2" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#fff7b2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff7b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff7b2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="404" cy="95" r="28" fill="#d9f3f0" opacity=".88"/>
    <path d="M209 425 229 215H283L303 425Z" fill="#f6f1e8"/>
    <path d="M218 330H294L299 378H213Z" fill="#e8483f"/>
    <path d="M225 255H287L291 297H221Z" fill="#e8483f"/>
    <rect x="218" y="198" width="76" height="20" rx="6" fill="#dce7e5"/>
    <rect x="232" y="158" width="48" height="42" rx="7" fill="#ffd85a"/>
    <rect x="240" y="166" width="32" height="26" rx="4" fill="#fff6a6"/>
    <circle cx="256" cy="179" r="24" fill="#fff2a0" opacity=".34" filter="url(#soft-glow)">
      <animate class="motion" attributeName="opacity" values=".24;.7;.24" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="m222 158 34-26 34 26Z" fill="#e8483f"/>
    <rect x="247" y="385" width="18" height="40" rx="8" fill="#173b4a"/>
    <path d="M-400 420Q-336 394-272 420T-144 420T-16 420T112 420T240 420T368 420T496 420T624 420T752 420T880 420V530H-400Z" fill="#12a6a0">
      <animateTransform class="motion" attributeName="transform" type="translate" values="-64 0;64 0;-64 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
    </path>
    <path d="M-480 452Q-416 428-352 452T-224 452T-96 452T32 452T160 452T288 452T416 452T544 452T672 452T800 452V530H-480Z" fill="#087a8c" opacity=".9">
      <animateTransform class="motion" attributeName="transform" type="translate" values="64 0;-64 0;64 0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
    </path>
    <g pointer-events="none">
      <g>
        <path d="M256 179 150 472H362Z" fill="url(#beam-fill)" opacity=".88"/>
        <path d="M256 179 238 472H274Z" fill="url(#beam-core)" opacity=".55"/>
        <animateTransform class="motion" attributeName="transform" type="rotate" values="-9 256 179;9 256 179;-9 256 179" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </g>
    </g>
