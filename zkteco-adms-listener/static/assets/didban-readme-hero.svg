<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" shape-rendering="geometricPrecision" role="img" aria-labelledby="scene-title scene-description">
  <title id="scene-title">صحنه فانوس دریایی دیدبان</title>
  <desc id="scene-description">فانوس دریایی کنار آب با نور جاروب‌شونده و موج‌های آرام</desc>
  <defs>
    <linearGradient id="scene-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f9c"/>
      <stop offset=".46" stop-color="#235d88"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <radialGradient id="scene-beam-fill" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#fff7b2" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#fff7b2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff7b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scene-beam-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b2" stop-opacity=".58"/>
      <stop offset="1" stop-color="#fff7b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scene-wave-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d94b8"/>
      <stop offset="1" stop-color="#3c6d98"/>
    </linearGradient>
    <filter id="scene-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@600;700;800&amp;display=swap');
      .scene-brand {
        font-family: "Vazirmatn", Tahoma, sans-serif;
        text-anchor: middle;
      }
      .scene-brand-title {
        fill: #ffd85a;
        font-size: 64px;
        font-weight: 800;
      }
      .scene-brand-description {
        fill: #dce9f6;
        font-size: 22px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#scene-sky)"/>
  <circle cx="1038" cy="60" r="25" fill="#dce9f6" opacity=".9"/>
  <circle cx="948" cy="44" r="1.8" fill="#fff7b2" opacity=".9"/>
  <circle cx="1110" cy="112" r="1.5" fill="#fff7b2" opacity=".82"/>
  <circle cx="830" cy="58" r="1.6" fill="#dce9f6" opacity=".78"/>
  <path d="M895 92l1.4 3.2 3.2 1.4-3.2 1.4-1.4 3.2-1.4-3.2-3.2-1.4 3.2-1.4z" fill="#fff7b2" opacity=".72"/>

  <g class="scene-brand" direction="rtl" unicode-bidi="plaintext">
    <text x="785" y="145" class="scene-brand-title">دیدبان</text>
    <text x="785" y="193" class="scene-brand-description">وضعیت دستگاه‌ها، کارکنان و داده‌های هویتی را از یک مرکز کنترل کنید.</text>
  </g>

  <g transform="translate(239 113) scale(.64) translate(-256 -179)">
    <circle cx="256" cy="179" r="24" fill="#fff2a0" opacity=".3" filter="url(#scene-soft-glow)">
      <animate attributeName="opacity" values=".2;.38;.24;.44;.2" dur="7.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.24;.5;.76;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </circle>
  </g>

  <g transform="translate(239 113) scale(.64) translate(-256 -179)">
    <path d="M209 425 229 215H283L303 425Z" fill="#f6f1e8"/>
    <path d="M218 330H294L299 378H213Z" fill="#e8483f"/>
    <path d="M225 255H287L291 297H221Z" fill="#e8483f"/>
    <rect x="218" y="198" width="76" height="20" rx="6" fill="#dce7e5"/>
    <rect x="232" y="158" width="48" height="42" rx="7" fill="#ffd85a"/>
    <rect x="240" y="166" width="32" height="26" rx="4" fill="#fff6a6"/>
    <path d="m222 158 34-26 34 26Z" fill="#e8483f"/>
    <rect x="247" y="385" width="18" height="40" rx="8" fill="#173b4a"/>
  </g>

  <path d="M-120 267Q-50 249 20 267T160 267T300 267T440 267T580 267T720 267T860 267T1000 267T1140 267T1280 267V360H-120Z" fill="url(#scene-wave-back)">
    <animateTransform attributeName="transform" type="translate" values="-64 0;-12 -2;52 1;18 3;-64 0" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.22;.5;.76;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
  </path>
  <path d="M-160 288Q-90 272-20 288T120 288T260 288T400 288T540 288T680 288T820 288T960 288T1100 288T1240 288V360H-160Z" fill="#2d537a" opacity=".94">
    <animateTransform attributeName="transform" type="translate" values="52 0;4 3;-70 -1;-28 2;52 0" dur="29s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.27;.51;.79;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
  </path>
  <path d="M-180 304Q-110 289-40 304T100 304T240 304T380 304T520 304T660 304T800 304T940 304T1080 304T1220 304T1360 304V360H-180Z" fill="#3c6790" opacity=".66">
    <animateTransform attributeName="transform" type="translate" values="-22 0;48 -2;88 1;-30 3;-22 0" dur="38s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.24;.53;.8;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
  </path>

  <g pointer-events="none" transform="translate(239 113) scale(.64) translate(-256 -179)">
    <g>
      <path d="M256 179 150 472H362Z" fill="url(#scene-beam-fill)" opacity=".74"/>
      <path d="M256 179 238 472H274Z" fill="url(#scene-beam-core)" opacity=".48"/>
      <animateTransform attributeName="transform" type="rotate" values="-25 256 179;-14 256 179;-2 256 179;16 256 179;24 256 179;3 256 179;-25 256 179" dur="16.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.16;.33;.5;.67;.84;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </g>
  </g>
</svg>
